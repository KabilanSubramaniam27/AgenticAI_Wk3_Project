[project]
name = "seniorcare-connect-ingestion"
version = "0.1.0"
description = "Public knowledge ingestion for SeniorCare Connect AI"
requires-python = ">=3.12"
dependencies = [
  "actian-vectorai-client>=0.1", "beautifulsoup4>=4.12", "httpx>=0.27",
  "lxml>=5.0", "openai>=1.0", "orjson>=3.10", "pydantic>=2.8",
  "pydantic-settings>=2.4", "pymupdf>=1.24", "python-dateutil>=2.9",
  "python-dotenv>=1.0", "pyyaml>=6.0", "rapidfuzz>=3.9", "rich>=13.7",
  "tenacity>=9.0", "tiktoken>=0.7", "trafilatura>=1.12", "typer>=0.12",
  "fastapi>=0.115", "langgraph>=0.2", "sentence-transformers>=3.0",
  "requests>=2.32", "streamlit>=1.39", "uvicorn>=0.30", "mcp>=1.29,<2",
  "langchain>=1.3,<2", "langchain-mcp-adapters>=0.3.2,<0.4",
  "langchain-openai>=1.6,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
seniorcare-ingest = "seniorcare_ingestion.cli:app"
seniorcare-api = "seniorcare_agents.api.app:run"
seniorcare-eval = "seniorcare_agents.evals.runner:main"
seniorcare-mcp = "seniorcare_agents.mcp.cli:run"
seniorcare-ui = "seniorcare_agents.ui.cli:run"

[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires live external services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "I", "UP", "B"]
